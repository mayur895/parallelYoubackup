<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tend — Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(60% 50% at 15% 0%, rgba(124,58,237,0.25), transparent 70%),
        radial-gradient(50% 40% at 85% 10%, rgba(245,158,11,0.20), transparent 65%),
        radial-gradient(80% 60% at 50% 100%, rgba(34,211,238,0.14), transparent 70%),
        #070b18;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f1f5f9;
      padding: 24px;
    }
    .card {
      text-align: center;
      padding: 44px 32px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      max-width: 440px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 80px -20px rgba(0,0,0,0.6);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 26px; margin-bottom: 10px;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #22d3ee, #fbbf24);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: #cbd5e1; line-height: 1.65; margin-bottom: 24px; font-size: 15px; }
    button {
      background: linear-gradient(135deg, #f59e0b, #f43f5e);
      color: white;
      border: none;
      padding: 13px 26px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Space Grotesk', inherit;
      letter-spacing: -0.01em;
      box-shadow: 0 12px 32px -10px #f59e0b;
      transition: transform .15s;
    }
    button:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="lg" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#22d3ee"/>
            <stop offset="100%" stop-color="#fbbf24"/>
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="18" height="18" rx="6" stroke="url(#lg)" stroke-width="2"/>
        <path d="M12 8v8M8 12h8" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>You're off the grid</h1>
    <p>Tend needs one connection on its first visit to download the AI model and protocols. After that, everything runs on this device — no internet required.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
